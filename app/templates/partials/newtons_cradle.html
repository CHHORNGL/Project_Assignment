<div class="newtons-cradle" style="{% if size %}--uib-size: {{ size }};{% endif %}{% if speed %}--uib-speed: {{ speed }};{% endif %}{% if color %}--uib-color: {{ color }};{% endif %}">
    <div class="newtons-cradle__dot"></div>
    <div class="newtons-cradle__dot"></div>
    <div class="newtons-cradle__dot"></div>
    <div class="newtons-cradle__dot"></div>
</div>
