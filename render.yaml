services:
  - type: keyvalue
    name: agrisense-kv
    region: singapore
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: agrisense-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: agrisense-uploads
      mountPath: /app/app/static/uploads
      sizeGB: 10
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_WORKER_CLASS
        value: gthread
      - key: GUNICORN_THREADS
        value: "6"
      - key: GUNICORN_TIMEOUT
        value: "180"
      - key: SEED_ACCOUNTS
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_CONTENT_LENGTH
        value: "16777216"

      # Security & Proxy Trust (Cloudflare orange-cloud proxy -> Render TLS ingress = 2 IP hops)
      - key: SECRET_KEY
        generateValue: true
      - key: TRUSTED_PROXY_COUNT
        value: "2"
      - key: SESSION_TYPE
        value: redis
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: SESSION_IDLE_TIMEOUT_SECONDS
        value: "1296000"
      - key: SESSION_ABSOLUTE_TIMEOUT_SECONDS
        value: "1296000"
      - key: APP_DOMAIN
        value: agricultureexp.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Render Key Value private connection string (sessions, rate limiting, weather cache)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agrisense-kv
          property: connectionString

      # Rate Limiting Budgets
      - key: RATE_LIMIT_GLOBAL
        value: "300 per minute;3000 per hour"
      - key: RATE_LIMIT_AUTH
        value: "10 per minute;100 per hour"
      - key: RATE_LIMIT_RECOVERY
        value: "5 per minute;20 per hour"
      - key: RATE_LIMIT_EXPENSIVE
        value: "30 per minute;300 per hour"

      # Neon Serverless PostgreSQL (set both pooled and direct unpooled secrets in Render Dashboard)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_RECYCLE
        value: "280"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_CONNECT_TIMEOUT
        value: "10"

      # Self-Trained Agricultural AI (Hugging Face Space)
      - key: AI_PROVIDER
        value: own-ai
      - key: HF_INFERENCE_URL
        value: https://maoseavik-agrisystem-agricultural-assistant.hf.space
      - key: HF_TOKEN
        sync: false
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "180"

      # Weather & Dynamic Themes
      - key: WEATHER_PROVIDER_BASE_URL
        value: https://api.open-meteo.com/v1/forecast
      - key: WEATHER_CACHE_TTL_SECONDS
        value: "600"
      - key: WEATHER_STALE_TTL_SECONDS
        value: "21600"
      - key: WEATHER_REQUEST_TIMEOUT_SECONDS
        value: "6"
      - key: THEME_EVENTS_PROVIDER
        value: auto
      - key: THEME_EVENTS_DEFAULT_COUNTRY
        value: KH
      - key: CALENDARIFIC_API_KEY
        sync: false
      - key: THEME_ANIMATION_CDN_PROVIDER
        value: auto
      - key: THEME_ANIMATION_MAX_BYTES
        value: "2097152"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: agri-theme-animations

      # OAuth, Transactional Email & Payments
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_DEFAULT_SENDER
        value: hellofromadmin@agricultureexp.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: BAKONG_TOKEN
        sync: false
      - key: BAKONG_ACCOUNT_ID
        sync: false
      - key: BAKONG_MERCHANT_NAME
        sync: false
      - key: BAKONG_MERCHANT_CITY
        value: Phnom Penh
      - key: BAKONG_CURRENCY
        value: USD
      - key: BAKONG_STORE_LABEL
        value: Agri System Pro

      # Initial Account Seeding (only needed if SEED_ACCOUNTS=true on a fresh DB)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EXPERT_EMAIL
        sync: false
      - key: EXPERT_PASSWORD
        sync: false
      - key: FARMER_PASSWORD
        sync: false
