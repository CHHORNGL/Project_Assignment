services:
  redis:
    image: redis:7-alpine
    container_name: project_assignment_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ratelimit_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: agri-expert-web:latest
    container_name: project_assignment
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED:-}
      - MIGRATION_DATABASE_URL=${MIGRATION_DATABASE_URL:-}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-280}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_CONNECT_TIMEOUT=${DB_CONNECT_TIMEOUT:-10}
      - SESSION_TYPE=redis
      - SESSION_REDIS_URL=redis://redis:6379/1
      - RATELIMIT_STORAGE_URI=redis://redis:6379/0
      - WEATHER_REDIS_URL=redis://redis:6379/2
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - SESSION_COOKIE_SAMESITE=${SESSION_COOKIE_SAMESITE:-Lax}
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT:-1}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - SEED_ACCOUNTS=${SEED_ACCOUNTS:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    volumes:
      - ./backend/uploads:/app/app/static/uploads
      - app_instance:/app/instance
    depends_on:
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: project_assignment_caddy
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: project_assignment_tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --protocol http2 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy

volumes:
  ratelimit_data:
  app_instance:
  caddy_data:
  caddy_config:
