name: Dependency Security & Integrity Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  audit-backend:
    name: Audit Python Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Verify dependency tree integrity (pip check)
        run: python -m pip check

      - name: Run dependency audit script
        run: python scripts/audit_dependencies.py --check-lockfile --strict --python-only

      - name: Run backend regression tests
        run: python -m unittest discover -s tests -v

  audit-frontend:
    name: Audit Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Audit npm packages for critical/high vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run JavaScript regression tests
        run: node --test tests/*.cjs tests/*.mjs
