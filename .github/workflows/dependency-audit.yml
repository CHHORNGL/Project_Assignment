name: Dependency Security & Integrity Audit

on:
  push:
    branches: [ main ]
    paths:
      - 'requirements*.txt'
      - 'requirements.lock'
      - 'frontend/package*.json'
      - 'mobile/pubspec*'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'requirements*.txt'
      - 'requirements.lock'
      - 'frontend/package*.json'
      - 'mobile/pubspec*'
      - '.github/workflows/dependency-audit.yml'

jobs:
  audit-backend:
    name: Audit Python Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pip-audit

      - name: Verify dependency tree integrity (pip check)
        run: python -m pip check

      - name: Run dependency audit script
        run: python scripts/audit_dependencies.py --check-lockfile

  audit-frontend:
    name: Audit Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Audit npm packages for critical/high vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high
