services:
  db:
    image: postgres:15-alpine
    container_name: project_assignment_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: project_assignment_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ratelimit_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project_assignment
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - SESSION_TYPE=redis
      - SESSION_REDIS_URL=redis://redis:6379/1
      - RATELIMIT_STORAGE_URI=redis://redis:6379/0
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT:-1}
      - POSTGRES_HOST=db
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./uploads:/app/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: project_assignment_tunnel
    restart: always
    command: tunnel --protocol http2 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  pgdata:
  ratelimit_data:
